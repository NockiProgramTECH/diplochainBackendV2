services:
  - type: web
    name: diplochainbackendv2
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --no-input && python manage.py shell -c "import os; from django.contrib.auth.hashers import make_password; from universities.models import University; e=os.environ.get('ADMIN_EMAIL','admin@gmail.com'); p=make_password(os.environ.get('ADMIN_PASSWORD','1234')); obj,created=University.objects.update_or_create(email=e, defaults=dict(name='Admin DiploChain',country='Burkina Faso',password=p,is_staff=True,is_superuser=True,is_active=True,acronym='ADM')); print('Admin',('cree' if created else 'mis a jour'))"
    startCommand: gunicorn config.wsgi:application
